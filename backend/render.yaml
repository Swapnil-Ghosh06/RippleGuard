services:
  - type: web
    name: rippleguard-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: CORS_ORIGINS
        value: "http://localhost:5173,https://rippleguard.vercel.app"
    healthCheckPath: /health
