<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="18" fill="#0a0a0a"/>
  <!-- Water drop / ripple icon -->
  <g transform="translate(50,52)" fill="white">
    <!-- Outer ripple ring left -->
    <path d="M-26,4 C-24,-4 -18,-10 -10,-12" stroke="white" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    <!-- Outer ripple ring right -->
    <path d="M26,4 C24,-4 18,-10 10,-12" stroke="white" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    <!-- Inner ripple ring left -->
    <path d="M-16,6 C-14,0 -9,-5 -4,-7" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Inner ripple ring right -->
    <path d="M16,6 C14,0 9,-5 4,-7" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Drop stem - the elongated splash -->
    <path d="M0,-8 C-2,-14 -3,-20 -1,-26 Q0,-30 1,-26 C3,-20 2,-14 0,-8Z"/>
    <!-- Drop ball at top -->
    <circle cx="0" cy="-28" r="3.2"/>
    <!-- Flat base of drop meeting ripple -->
    <ellipse cx="0" cy="-6" rx="6" ry="3" opacity="0.9"/>
  </g>
</svg>